<!-- tailwind_feedback.html (Enhanced with Edit/Delete/Stars) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Hot 'N Sizzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="navbar.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rubik', sans-serif; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-slide-up { animation: slide-up 0.8s ease-out; }
        
        .hover-lift {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(234, 88, 12, 0.2);
        }
        
        .speech-bubble {
            position: relative;
            background: white;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 30px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 20px solid white;
        }
        .speech-bubble:hover {
            box-shadow: 0 15px 30px rgba(234, 88, 12, 0.3);
            transform: translateY(-5px);
        }
        
        .star-rating {
            display: flex;
            gap: 5px;
        }
        .star {
            font-size: 1.5rem;
            color: #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .star:hover, .star.active {
            color: #ea580c;
            transform: scale(1.2);
        }
        
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.6);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans">

    <section class="relative h-[40vh] flex flex-col items-center justify-center text-center px-4 border-b border-orange-600 overflow-hidden"
         style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('covernologo.jpg'); background-size: cover; background-position: center;">
        
        <div class="absolute top-10 left-10 text-5xl animate-float opacity-30">🌶️</div>
        <div class="absolute top-20 right-20 text-4xl animate-float opacity-30" style="animation-delay: 1s;">🔥</div>
        
        <h1 class="text-5xl md:text-7xl font-black italic text-orange-600 uppercase tracking-tighter drop-shadow-[0_4px_0_rgba(0,0,0,1)] animate-slide-up">
            Customer Sizzle
        </h1>
        <p class="text-white text-lg font-bold uppercase tracking-widest mt-2 bg-black/40 px-4 py-1 animate-slide-up" style="animation-delay: 0.2s;">
            Hear from our happy diners
        </p>
    </section>

    <main class="max-w-6xl mx-auto py-16 px-6">
        <div class="grid lg:grid-cols-3 gap-12">
            
            <!-- Feedback Form -->
            <div class="lg:col-span-1 bg-zinc-900 p-8 rounded-2xl border border-zinc-800 h-fit sticky top-24 shadow-2xl hover-lift reveal">
                <h2 class="text-2xl font-black uppercase text-orange-500 mb-2">Share the Heat</h2>
                <p class="text-zinc-500 text-xs uppercase tracking-widest mb-6 font-bold">Tell us about your visit</p>
                
                <!-- Name Input -->
                <div class="mb-4">
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-zinc-400 mb-2">Your Name *</label>
                    <input type="text" id="reviewerName" placeholder="Enter your name" 
                        class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white focus:outline-none focus:border-orange-600 transition-colors">
                </div>

                <form id="feedbackForm" class="space-y-5" onsubmit="submitFeedback(event)">
                    <input type="hidden" id="editingId" value="">
                    
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-zinc-400 mb-3">What are you reviewing?</label>
                        <div class="grid grid-cols-3 gap-2" id="category-group">
                            <button type="button" onclick="selectCategory(this, 'food')" class="category-btn border border-orange-600 bg-orange-600 text-white text-[10px] font-black py-2 rounded-md uppercase transition-all hover:scale-105">Food</button>
                            <button type="button" onclick="selectCategory(this, 'staff')" class="category-btn border border-zinc-700 text-zinc-500 text-[10px] font-black py-2 rounded-md uppercase hover:border-orange-600 hover:text-orange-600 transition-all">Staff</button>
                            <button type="button" onclick="selectCategory(this, 'place')" class="category-btn border border-zinc-700 text-zinc-500 text-[10px] font-black py-2 rounded-md uppercase hover:border-orange-600 hover:text-orange-600 transition-all">Place</button>
                        </div>
                        <input type="hidden" id="selected-category" value="food">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-zinc-500 mb-2">Star Rating</label>
                        <div class="star-rating" id="starContainer">
                            <span class="star active" onclick="setRating(1)">★</span>
                            <span class="star active" onclick="setRating(2)">★</span>
                            <span class="star active" onclick="setRating(3)">★</span>
                            <span class="star active" onclick="setRating(4)">★</span>
                            <span class="star active" onclick="setRating(5)">★</span>
                        </div>
                        <input type="hidden" id="ratingValue" value="5">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-zinc-500 mb-2">The Sizzle (Review)</label>
                        <textarea id="reviewText" rows="4" placeholder="How was the Bulalo? How was the service? How was the place?" 
                            class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white focus:outline-none focus:border-orange-600 transition resize-none"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" 
                        class="w-full bg-orange-600 hover:bg-white hover:text-orange-600 text-white font-black py-4 rounded-full uppercase tracking-widest text-sm transition-all duration-300 shadow-lg shadow-orange-900/20 btn-glow">
                        Submit Feedback
                    </button>
                    <button type="button" id="cancelBtn" onclick="cancelEdit()" 
                        class="hidden w-full bg-zinc-700 text-white font-black py-3 rounded-full uppercase tracking-widest text-sm transition-all hover:bg-zinc-600">
                        Cancel Edit
                    </button>
                </form>
            </div>

            <!-- Reviews Display -->
            <div class="lg:col-span-2 space-y-8" id="reviewsContainer">
                <!-- Reviews injected by JS -->
            </div>
        </div>
    </main>

    <footer class="bg-black py-12 px-8 border-t border-zinc-800 text-center">
        <p class="text-zinc-500 text-sm font-bold uppercase tracking-[0.2em]">© 2026 HOT 'N SIZZLE GRILL & RESTAURANT. EST 2024.</p>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 right-8 bg-orange-600 text-white px-6 py-4 rounded-xl shadow-2xl transform translate-y-24 opacity-0 transition-all duration-300 z-50 font-bold">
        <span id="toastMessage">Notification</span>
    </div>

    <script>
        // =============================================
        // SUPABASE CONFIG — replace with your own keys
        // =============================================
        const SUPABASE_URL = 'https://zcjzuduvquazmkpxzwwf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjanp1ZHV2cXVhem1rcHh6d3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNDEyMzEsImV4cCI6MjA5NDgxNzIzMX0.j30hzrpg23V0qILblJYrPOIoXK-wz9zPFrcfOWVBvnU';

        // =============================================
        // LOGIN GUARD — this page requires a signed-in customer.
        // =============================================
        if (!localStorage.getItem('cust_token')) {
            window.location.href = 'auth.html?redirect=feedback.html';
        }

        // =============================================
        // SUPABASE HELPER
        // =============================================
        async function supabase(method, path, body) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
                method,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: body ? JSON.stringify(body) : undefined
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || 'Supabase error');
            }
            return res.status === 204 ? null : res.json();
        }

        // =============================================
        // STATE
        // =============================================
        let reviews = [];
        let currentRating = 5;
        let currentUser = localStorage.getItem('cust_name') || localStorage.getItem('hns_currentUser') || '';

        // =============================================
        // INIT
        // =============================================
        document.addEventListener('DOMContentLoaded', async () => {
            if(currentUser) document.getElementById('reviewerName').value = currentUser;
            setupStarListeners();
            await loadReviews();

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if(entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });

        // =============================================
        // LOAD REVIEWS FROM SUPABASE
        // =============================================
        async function loadReviews() {
            try {
                const data = await supabase('GET', 'feedback?select=*&order=created_at.desc');
                reviews = data || [];
                renderReviews();
            } catch(err) {
                console.error('Load error:', err);
                document.getElementById('reviewsContainer').innerHTML =
                    '<p class="text-zinc-500 italic text-center py-12">Could not load reviews. Check your Supabase config.</p>';
            }
        }

        // =============================================
        // STAR RATING
        // =============================================
        function setupStarListeners() {
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                star.addEventListener('mouseenter', () => highlightStars(index + 1));
                star.addEventListener('click', () => setRating(index + 1));
            });
            document.getElementById('starContainer').addEventListener('mouseleave', () => highlightStars(currentRating));
        }

        function highlightStars(count) {
            document.querySelectorAll('.star').forEach((star, index) => {
                star.classList.toggle('active', index < count);
                star.style.color = index < count ? '#ea580c' : '#ddd';
            });
        }

        function setRating(rating) {
            currentRating = rating;
            document.getElementById('ratingValue').value = rating;
            highlightStars(rating);
            const stars = document.querySelectorAll('.star');
            stars[rating - 1].style.transform = 'scale(1.4)';
            setTimeout(() => { stars[rating - 1].style.transform = 'scale(1.2)'; }, 200);
        }

        // =============================================
        // CATEGORY SELECT
        // =============================================
        function selectCategory(btn, category) {
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-orange-600', 'text-white', 'border-orange-600');
                b.classList.add('border-zinc-700', 'text-zinc-500');
            });
            btn.classList.remove('border-zinc-700', 'text-zinc-500');
            btn.classList.add('bg-orange-600', 'text-white', 'border-orange-600');
            document.getElementById('selected-category').value = category;
        }

        // =============================================
        // SUBMIT FEEDBACK (INSERT or UPDATE)
        // =============================================
        async function submitFeedback(e) {
            e.preventDefault();

            const name     = document.getElementById('reviewerName').value.trim();
            const text     = document.getElementById('reviewText').value.trim();
            const category = document.getElementById('selected-category').value;
            const editingId = document.getElementById('editingId').value;

            if(!name) { showToast('Please enter your name!'); return; }
            if(!text) { showToast('Please write a review!'); return; }

            localStorage.setItem('hns_currentUser', name);
            currentUser = name;

            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Saving...';
            btn.disabled = true;

            try {
                if(editingId) {
                    // Check ownership
                    const review = reviews.find(r => r.id == editingId);
                    if(!review || review.customer_name !== name) {
                        showToast('You can only edit your own reviews!');
                        btn.disabled = false;
                        btn.textContent = 'Update Review';
                        return;
                    }
                    // Check 24hr window
                    const hoursOld = (Date.now() - new Date(review.created_at).getTime()) / 3600000;
                    if(hoursOld > 24) {
                        showToast('Edit window has expired (24 hours).');
                        cancelEdit();
                        btn.disabled = false;
                        return;
                    }
                    await supabase('PATCH', `feedback?id=eq.${editingId}`, {
                        review_text: text,
                        category: category,
                        rating: currentRating
                    });
                    showToast('Review updated successfully!');
                    cancelEdit();
                } else {
                    // New review
                    await supabase('POST', 'feedback', {
                        customer_name: name,
                        review_text: text,
                        category: category,
                        rating: currentRating
                    });
                    showToast('Thank you for your feedback!');
                    document.getElementById('reviewText').value = '';
                    setRating(5);
                }
                await loadReviews();
            } catch(err) {
                console.error('Submit error:', err);
                showToast('Error saving. Check console for details.');
            } finally {
                btn.disabled = false;
                if(!document.getElementById('editingId').value) {
                    btn.textContent = 'Submit Feedback';
                }
            }
        }

        // =============================================
        // RENDER REVIEWS
        // =============================================
        function renderReviews() {
            const container = document.getElementById('reviewsContainer');

            if(!reviews.length) {
                container.innerHTML = '<p class="text-zinc-500 italic text-center py-12">No reviews yet. Be the first to share the heat!</p>';
                return;
            }

            container.innerHTML = reviews.map((review, index) => {
                const isOwner  = review.customer_name === currentUser;
                const hoursOld = (Date.now() - new Date(review.created_at).getTime()) / 3600000;
                const within24 = hoursOld < 24;
                const hoursLeft = Math.max(0, Math.floor(24 - hoursOld));
                const canEdit  = isOwner && within24;
                const rating   = review.rating || 5;

                return `
                    <div class="speech-bubble p-8 relative reveal" style="animation-delay: ${index * 0.1}s;">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-${getCategoryColor(review.category)}-100 text-${getCategoryColor(review.category)}-600 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter">
                                Topic: ${review.category}
                            </span>
                            <div class="text-orange-500 text-lg font-black tracking-widest">
                                ${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}
                            </div>
                        </div>

                        <p class="text-xl italic font-bold leading-tight text-black mb-4">"${review.review_text}"</p>

                        <div class="flex items-center justify-between border-t border-zinc-200 pt-4">
                            <div class="flex items-center">
                                <div class="w-10 h-10 bg-orange-600 rounded-full flex items-center justify-center text-white font-black mr-3">
                                    ${review.customer_name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <p class="font-black uppercase text-xs text-black">${review.customer_name}</p>
                                    <p class="text-[10px] text-zinc-500 font-bold uppercase">Verified Diner</p>
                                </div>
                            </div>

                            ${canEdit ? `
                                <div class="flex gap-2">
                                    <button onclick="editReview(${review.id})"
                                        class="px-4 py-2 bg-orange-600 text-white text-xs font-black uppercase rounded-lg hover:bg-orange-700 transition-all hover:scale-105">
                                        ✏️ Edit
                                    </button>
                                    <button onclick="deleteReview(${review.id})"
                                        class="px-4 py-2 bg-red-600 text-white text-xs font-black uppercase rounded-lg hover:bg-red-700 transition-all hover:scale-105">
                                        🗑️ Delete
                                    </button>
                                </div>
                            ` : ''}
                        </div>

                        ${canEdit ? `
                            <p class="text-[10px] text-zinc-400 mt-2 text-right">⏳ Editable for ${hoursLeft}h more</p>
                        ` : ''}
                    </div>
                `;
            }).join('');

            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
            }, 100);
        }

        function getCategoryColor(cat) {
            return cat === 'food' ? 'orange' : cat === 'staff' ? 'blue' : 'green';
        }

        // =============================================
        // EDIT REVIEW
        // =============================================
        function editReview(id) {
            const review = reviews.find(r => r.id === id);
            if(!review) return;

            if(review.customer_name !== currentUser) {
                showToast('You can only edit your own reviews!');
                return;
            }

            const hoursOld = (Date.now() - new Date(review.created_at).getTime()) / 3600000;
            if(hoursOld > 24) {
                showToast('Sorry, edit window has expired (24 hours).');
                return;
            }

            document.getElementById('reviewerName').value  = review.customer_name;
            document.getElementById('reviewText').value    = review.review_text;
            document.getElementById('editingId').value     = id;
            document.getElementById('ratingValue').value   = review.rating;
            document.getElementById('selected-category').value = review.category;

            setRating(review.rating || 5);
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.textContent.trim().toLowerCase() === review.category) {
                    selectCategory(btn, review.category);
                }
            });

            document.getElementById('submitBtn').textContent = 'Update Review';
            document.getElementById('cancelBtn').classList.remove('hidden');
            document.querySelector('.sticky').scrollIntoView({ behavior: 'smooth' });
            showToast('Editing your review...');
        }

        // =============================================
        // DELETE REVIEW
        // =============================================
        async function deleteReview(id) {
            const review = reviews.find(r => r.id === id);
            if(!review) return;

            if(review.customer_name !== currentUser) {
                showToast('You can only delete your own reviews!');
                return;
            }

            const hoursOld = (Date.now() - new Date(review.created_at).getTime()) / 3600000;
            if(hoursOld > 24) {
                showToast('Sorry, delete window has expired (24 hours).');
                return;
            }

            if(confirm('Are you sure you want to delete this review?')) {
                try {
                    await supabase('DELETE', `feedback?id=eq.${id}`);
                    showToast('Review deleted.');
                    await loadReviews();
                } catch(err) {
                    console.error('Delete error:', err);
                    showToast('Error deleting review.');
                }
            }
        }

        // =============================================
        // CANCEL EDIT
        // =============================================
        function cancelEdit() {
            document.getElementById('editingId').value  = '';
            document.getElementById('reviewText').value = '';
            document.getElementById('submitBtn').textContent = 'Submit Feedback';
            document.getElementById('cancelBtn').classList.add('hidden');
            setRating(5);
        }

        // =============================================
        // TOAST
        // =============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>

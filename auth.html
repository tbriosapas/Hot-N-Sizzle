<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity | Hot 'N Sizzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="navbar.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght=0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rubik', sans-serif; }
        
        @keyframes slide-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slide-in 0.4s ease-out forwards; }
        
        .hover-lift { transition: all 0.3s ease; }
        .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(234, 88, 12, 0.2); }
        
        .btn-glow { transition: all 0.3s ease; }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(234, 88, 12, 0.5); transform: scale(1.02); }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col justify-between">

    <div class="flex-1 flex items-center justify-center p-6 md:p-12">
        <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-8 hover-lift animate-slide-in shadow-2xl">
            
            <header class="mb-8 text-center">
                <h1 id="authTitle" class="text-3xl font-black italic text-orange-500 uppercase tracking-tighter mb-2">
                    Verify Identity
                </h1>
                <p id="authSubtitle" class="text-xs text-zinc-400 uppercase tracking-widest font-medium">Please sign in to unlock Tray Orders & Feedback</p>
            </header>

            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                
                <div id="registerFields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-black uppercase text-white tracking-wider mb-2 border-l-2 border-orange-600 pl-2">Full Name</label>
                        <input type="text" id="authName" class="w-full bg-black border border-zinc-700 rounded p-3 text-sm outline-none focus:border-orange-500 text-zinc-300 transition-colors" placeholder="Juan Dela Cruz">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase text-white tracking-wider mb-2 border-l-2 border-orange-600 pl-2">Contact Number</label>
                        <input type="tel" id="authPhone" class="w-full bg-black border border-zinc-700 rounded p-3 text-sm outline-none focus:border-orange-500 text-zinc-300 transition-colors" placeholder="09123456789">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black uppercase text-white tracking-wider mb-2 border-l-2 border-orange-600 pl-2">Email Address</label>
                    <input type="email" id="authEmail" required class="w-full bg-black border border-zinc-700 rounded p-3 text-sm outline-none focus:border-orange-500 text-zinc-300 transition-colors" placeholder="customer@email.com">
                </div>

                <div>
                    <label class="block text-xs font-black uppercase text-white tracking-wider mb-2 border-l-2 border-orange-600 pl-2">Password</label>
                    <input type="password" id="authPassword" required class="w-full bg-black border border-zinc-700 rounded p-3 text-sm outline-none focus:border-orange-500 text-zinc-300 transition-colors" placeholder="••••••••">
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full bg-orange-600 py-4 font-black uppercase tracking-widest text-sm rounded-lg hover:bg-orange-700 btn-glow transition-all duration-300 mt-2">
                    Confirm Sign In
                </button>
            </form>

            <div class="mt-8 pt-4 border-t border-zinc-800 text-center">
                <p class="text-xs text-zinc-400 font-medium uppercase tracking-wider">
                    <span id="authToggleText">Don't have an account yet?</span>
                    <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-orange-500 font-black hover:underline ml-1">Sign Up</button>
                </p>
            </div>

        </div>
    </div>

    <div id="toast" class="fixed bottom-8 right-8 bg-orange-600 text-white px-6 py-4 rounded-xl shadow-2xl transform translate-y-24 opacity-0 transition-all duration-300 z-50 font-bold flex items-center gap-2">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage">Success</span>
    </div>

    <script>
        const SUPABASE_URL = 'https://zcjzuduvquazmkpxzwwf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjanp1ZHV2cXVhem1rcHh6d3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNDEyMzEsImV4cCI6MjA5NDgxNzIzMX0.j30hzrpg23V0qILblJYrPOIoXK-wz9zPFrcfOWVBvnU';
        let isSignUpMode = false;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const btn = document.getElementById('authSubmitBtn');
            const toggleText = document.getElementById('authToggleText');
            const toggleBtn = document.getElementById('authToggleBtn');
            const registerFields = document.getElementById('registerFields');

            if (isSignUpMode) {
                title.textContent = "Create Account";
                subtitle.textContent = "Join the club to place active tray orders";
                btn.textContent = "Confirm Registration";
                toggleText.textContent = "Already have an account?";
                toggleBtn.textContent = "Sign In";
                registerFields.classList.remove('hidden');
                document.getElementById('authName').required = true;
            } else {
                title.textContent = "Verify Identity";
                subtitle.textContent = "Please sign in to unlock Tray Orders & Feedback";
                btn.textContent = "Confirm Sign In";
                toggleText.textContent = "Don't have an account yet?";
                toggleBtn.textContent = "Sign Up";
                registerFields.classList.add('hidden');
                document.getElementById('authName').required = false;
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const name = document.getElementById('authName').value;
            const phone = document.getElementById('authPhone').value;

            const endpoint = isSignUpMode ? 'signup' : 'token?grant_type=password';
            const btn = document.getElementById('authSubmitBtn');
            
            btn.disabled = true;
            btn.textContent = 'Processing...';

            let requestBody = { email, password };
          
            if (isSignUpMode) {
                // Correctly place profile properties in the root 'data' object
                requestBody.data = {
                    full_name: name,
                    phone_number: phone
                };
                // Correctly use snake_case for raw HTTP GoTrue endpoint routing
                requestBody.options = {
                    email_redirect_to: `${window.location.origin}${window.location.pathname}?redirect=${encodeURIComponent(getRedirectTarget())}`
                };
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const data = await response.json();
                if(!response.ok) throw new Error(data.msg || data.message || data.error_description || JSON.stringify(data));
                
                if(isSignUpMode) {
                    showToast("📩 Verification email sent!");
                    alert("Verification link sent! Check your email inbox to confirm your registration. You'll be brought back here automatically once you click the link.");
                } else {
                    const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/users_profile?select=*`, {
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${data.access_token}` }
                    });
                    const profiles = await profileRes.json();
                    const myProfile = profiles && profiles[0] ? profiles[0] : null;

                    if (myProfile && myProfile.blocked) {
                        throw new Error("This account has been blocked. Please contact Hot 'N Sizzle if you believe this is a mistake.");
                    }

                    localStorage.setItem('cust_token', data.access_token);
                    localStorage.setItem('sb_user_id', data.user.id);
                    localStorage.setItem('cust_email', data.user.email);

                    if (myProfile) {
                        localStorage.setItem('cust_name', myProfile.full_name || data.user.email.split('@')[0]);
                        localStorage.setItem('cust_phone', myProfile.phone_number || '');
                    } else {
                        localStorage.setItem('cust_name', data.user.email.split('@')[0]);
                    }
                    
                    showToast("✅ Authenticated!");
                    setTimeout(() => window.location.href = getRedirectTarget(), 1000);
                }
            } catch(err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = isSignUpMode ? "Confirm Registration" : "Confirm Sign In";
            }
        }

        // Reads ?redirect=order.html (or feedback.html) so a guest who was
        // bounced here from a gated link lands back where they wanted to go.
        function getRedirectTarget() {
            const params = new URLSearchParams(window.location.search);
            const target = params.get('redirect');
            const allowed = ['order.html', 'feedback.html'];
            return allowed.includes(target) ? target : 'order.html';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 2500);
        }

        // Catch incoming email link confirmation token redirection.
        // Supabase redirects the verification link back to this page with
        // #access_token=... in the URL hash — we log the customer in
        // automatically and send them straight to where they wanted to go.
        (() => {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token=')) {
                const params = new URLSearchParams(hash.replace('#', '?'));
                const token = params.get('access_token');
                if (token) {
                    (async () => {
                        localStorage.setItem('cust_token', token);
                        window.location.hash = "";
                        try {
                            const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
                            });
                            const user = await userRes.json();
                            if (user && user.id) {
                                localStorage.setItem('sb_user_id', user.id);
                                localStorage.setItem('cust_email', user.email);
                                const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/users_profile?select=*`, {
                                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
                                });
                                const profiles = await profileRes.json();
                                if (profiles && profiles[0]) {
                                    localStorage.setItem('cust_name', profiles[0].full_name || user.email.split('@')[0]);
                                    localStorage.setItem('cust_phone', profiles[0].phone_number || '');
                                }
                            }
                        } catch (e) { /* profile fetch best-effort, ignore */ }

                        showToast("✅ Email verified! Taking you in...");
                        setTimeout(() => window.location.href = getRedirectTarget(), 1200);
                    })();
                }
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order & Reserve | Hot 'N Sizzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <script src="navbar.js"></script>
    <style>
        body { font-family: 'Rubik', sans-serif; background-color: #0d0d0d; color: white; }
        @keyframes slide-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 10px rgba(234, 88, 12, 0.3); } 50% { box-shadow: 0 0 20px rgba(234, 88, 12, 0.6); } }
        .animate-slide-in { animation: slide-in 0.4s ease-out forwards; }
        .pulse-glow { animation: pulse-glow 3s infinite; }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen pb-12">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-4xl font-black text-center text-orange-500 my-6 uppercase">Order & Placement Manifest</h1>
        
        <div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800 max-w-xl mx-auto">
            <form id="orderForm" onsubmit="event.preventDefault(); validateAndProcessOrder();" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-bold text-zinc-400 mb-1">Diner Name</label>
                    <input type="text" id="customerName" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-zinc-400 mb-1">Contact Email</label>
                    <input type="email" id="customerEmail" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-zinc-400 mb-1">Cell Number</label>
                    <input type="tel" id="customerPhone" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white">
                </div>
                <button type="submit" id="submitOrderBtn" class="w-full bg-orange-600 hover:bg-orange-500 py-4 font-black uppercase rounded-lg transition pulse-glow">Place Your Order</button>
            </form>
        </div>
    </div>

    <div id="authModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 hidden backdrop-blur-sm">
        <div class="bg-zinc-900 border border-orange-600 p-8 rounded-2xl w-full max-w-md mx-4 shadow-2xl relative animate-slide-in">
            <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
            <h3 id="authTitle" class="text-2xl font-black text-orange-500 mb-6 uppercase tracking-wider text-center">Sign In to Order</h3>
            
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="registerFields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Full Name</label>
                        <input type="text" id="authName" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">CP (Phone) Number</label>
                        <input type="tel" id="authPhone" placeholder="09123456789" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Email Address</label>
                    <input type="email" id="authEmail" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Password</label>
                    <input type="password" id="authPassword" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                </div>
                
                <button type="submit" id="authSubmitBtn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-black uppercase py-4 rounded-xl tracking-wider transition">Sign In</button>
            </form>
            
            <p class="text-center text-sm text-zinc-400 mt-6 font-medium">
                <span id="authToggleText">Don't have an account?</span>
                <button onclick="toggleAuthMode()" class="text-orange-500 font-bold hover:underline ml-1" id="authToggleBtn">Sign Up</button>
            </p>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-zinc-900 border border-orange-500 text-white px-6 py-4 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-24 opacity-0 z-50 flex items-center space-x-3">
        <i class="fas fa-info-circle text-orange-500 text-xl"></i>
        <span id="toastMessage" class="font-bold text-sm uppercase tracking-wide">Processing action...</span>
    </div>

    <script>
        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

        let isSignUpMode = false;
        let authenticatedUser = null;

        function toggleAuthModal() {
            document.getElementById('authModal').classList.toggle('hidden');
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').textContent = isSignUpMode ? "Create Account" : "Sign In";
            document.getElementById('authSubmitBtn').textContent = isSignUpMode ? "Register & Verify" : "Sign In";
            document.getElementById('authToggleText').textContent = isSignUpMode ? "Already have an account?" : "Don't have an account?";
            document.getElementById('authToggleBtn').textContent = isSignUpMode ? "Sign In" : "Sign Up";
            document.getElementById('registerFields').classList.toggle('hidden', !isSignUpMode);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-24', 'opacity-0'); }, 3000);
        }

        // Handle inline account handling
        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const name = document.getElementById('authName').value;
            const phone = document.getElementById('authPhone').value;

            const endpoint = isSignUpMode ? 'signup' : 'token?grant_type=password';
            const bodyPayload = isSignUpMode ? { email, password } : { email, password };

            try {
                // Connect directly to Supabase Auth microservice endpoint
                const response = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyPayload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.msg || data.error_description || "Authentication failure.");

                authenticatedUser = data.user || data;
                const token = data.access_token;

                // For sign up operations, create corresponding context record inside profiles table
                if (isSignUpMode && authenticatedUser) {
                    await fetch(`${SUPABASE_URL}/rest/v1/users_profile`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({
                            id: authenticatedUser.id,
                            full_name: name,
                            email: email,
                            phone_number: phone,
                            is_blocked: false
                        })
                    });
                }

                // Attach token context locally to maintain persistent pipeline operational sessions
                localStorage.setItem('sb_session_token', token);
                localStorage.setItem('sb_user_id', authenticatedUser.id || authenticatedUser.user.id);

                showToast("Account validation verified successfully!");
                toggleAuthModal();
                executeFinalDatabaseOrderPlacement();

            } catch (err) {
                alert(`Authentication Exception: ${err.message}`);
            }
        }

        // Intercept placement to execute verification pipeline checks
        async function validateAndProcessOrder() {
            const token = localStorage.getItem('sb_session_token');
            const userId = localStorage.getItem('sb_user_id');

            if (!token || !userId) {
                showToast("Diner verification check missing. Please sign in.");
                toggleAuthModal();
                return;
            }

            // Verify if user account is flagged as blocked
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users_profile?id=eq.${userId}&select=is_blocked`, {
                    method: 'GET',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
                });
                const profileData = await response.json();
                
                if(profileData && profileData[0] && profileData[0].is_blocked) {
                    alert("Order Denied: Your account has been locked or restricted from placing orders due to policy violations.");
                    return;
                }

                executeFinalDatabaseOrderPlacement();
            } catch (err) {
                console.error(err);
                executeFinalDatabaseOrderPlacement();
            }
        }

        async function executeFinalDatabaseOrderPlacement() {
            const userId = localStorage.getItem('sb_user_id');
            const token = localStorage.getItem('sb_session_token');
            
            showToast("Submitting order ticket to kitchen...");
            
            const orderPayload = {
                customer_name: document.getElementById('customerName').value,
                email: document.getElementById('customerEmail').value,
                phone: document.getElementById('customerPhone').value,
                user_id: userId,
                status: 'pending',
                created_at: new Date()
            };

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(orderPayload)
                });

                if(response.ok) {
                    showToast("Order confirmed successfully!");
                    document.getElementById('orderForm').reset();
                } else {
                    throw new Error("Failed to post record.");
                }
            } catch(e) {
                alert(e.message);
            }
        }
    </script>
</body>
</html>
